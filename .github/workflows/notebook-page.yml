name: notebook-page

# Publishes the saved run of the CALMaR notebook as a page people can read, at
# https://calmar.aphasia-kb.app (GitHub Pages for this repository; the address is set in
# Settings → Pages). It runs whenever the notebook is pushed to main, and from
# "Run workflow" on the Actions tab.
#
# The page builder and its styles live in the knowledge-base repository
# (scripts/build_notebook_page.py, explorer/*.css), checked out beside this one, so the page
# looks like the knowledge-base explorer it links to.
#
# Only open data may be published. The builder stops (--strict) when the run names a dataset
# that is not known to be open; nothing is published then and the page that is live stays.
on:
  push:
    branches: [main]
    paths:
      - lesion-interpretation-pipeline.ipynb
      - demo/**
      - .github/workflows/notebook-page.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NOTEBOOK: lesion-interpretation-pipeline.ipynb
  # Set PUBLISH_DEMO to "0" to publish NOTEBOOK again; retain demo/ for the archived run.
  PUBLISH_DEMO: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the page builder and styles from the knowledge base
        uses: actions/checkout@v4
        with:
          repository: micmas/stroke-aphasia-kb
          ref: ae09ecbd0c30bbc344d95f3af7021cc197917c31
          path: _kb
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/build_notebook_page.py
            scripts/style_project_site.py
            explorer/project-shell.css
            explorer/project-shell.js
            explorer/styles.css
            explorer/notebook.css
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the markdown renderer
        run: python -m pip install "markdown-it-py>=3.0"
      - name: Build the page
        run: |
          if [ "$PUBLISH_DEMO" = "1" ]; then
            python -c 'import json; m=json.load(open("demo/publication.json")); assert m["state"] == "ready" and not m["page"]["unknown"] and not m["page"]["errors"]'
            python _kb/scripts/build_notebook_page.py --calmar . --notebook demo/lesion-interpretation-demo.ipynb \
              --out _demo_validation --strict --source-commit "$GITHUB_SHA"
            mkdir -p _site
            cp -a demo/. _site/
            python -c 'import json,os; p="_site/build.json"; d=json.load(open(p)); d["notebook_commit"]=os.environ["GITHUB_SHA"]; open(p,"w").write(json.dumps(d,indent=2)+"\n")'
          else
            python _kb/scripts/build_notebook_page.py --calmar . --notebook "$NOTEBOOK" \
              --out _site --strict --source-commit "$GITHUB_SHA"
          fi
      - name: Apply shared project navigation and themes
        run: python _kb/scripts/style_project_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
