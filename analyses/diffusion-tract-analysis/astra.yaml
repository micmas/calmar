id: diffusion_tract_analysis
version: "0.0.14"
name: Optional lesion-aware direct diffusion analysis
description: >
  Opt-in analysis of participant directional diffusion MRI, separate from the
  trace-DWI/ADC OpenADS lesion route and from BCBToolkit/DeepDisco normative
  disconnectomes. Discovery requires readable b-values, b-vectors and JSON
  metadata, at least one b=0 volume and at least 30 distinct diffusion directions
  before a series can contribute to a participant report. QSIPrep performs
  lesion-aware preprocessing. The explicitly selected second stage is either
  QSIRecon experimental patient-specific bundle tractometry or DIPY
  weighted-least-squares diffusion-tensor maps and whole-brain summaries.
  These outputs are never combined or relabelled as one another. A missing or
  low-count bundle is treated as a tracking/QC outcome, not proof of anatomical
  disconnection. Findings are recorded only after the selected method's saved
  visual QC has been inspected.
inputs:
  - id: scheduler_request
    type: data
    source: reports/jobs/<job-id>/request.json
    description: >
      Per-participant request created by calmar.scheduled from the explicit
      reports/dmri-selection.json choice. It names the dataset, anatomical T1w,
      selected DWI series and sidecars, lesion-mask source and method options.
  - id: bids_dataset
    type: data
    source: data/ds004884
    description: >
      Pinned source dataset. The retained preprocessing job materializes only
      the explicitly selected DWI/T1w inputs and stages a private BIDS subset;
      it does not modify this dataset.
  - id: selected_lesion_mask
    type: data
    source: data/ds004884/derivatives
    description: >
      Selected native-T1 manual, LINDA or SynthStroke lesion mask. It is staged as
      *_label-lesion_roi.nii.gz so QSIPrep can exclude the focal lesion from
      anatomical normalization. The exact file, source and sessions are recorded
      per participant; downstream reporting retains a visual-QC warning.
decisions:
  analysis_method:
    label: Direct diffusion reconstruction method
    rationale: >
      QSIRecon bundle tractometry and DIPY voxelwise DTI answer different
      questions. The notebook therefore exposes them as alternative complete
      analysis paths after shared QSIPrep preprocessing, rather than treating
      DIPY as an extra QSIRecon metric.
    default: qsirecon
    options:
      qsirecon:
        label: QSIRecon bundle tractometry (qsirecon)
        description: Produces participant-specific bundles and bundle FA/MD summaries.
      dipy_dti:
        label: DIPY weighted-least-squares tensor maps (dipy_dti)
        description: >
          Single-shell voxelwise FA, MD, AD and RD maps with a whole-brain
          summary and saved FA/MD visual-QC montage; no bundles. Multi-shell
          sessions are refused rather than fitting one tensor across high-b shells.
  motion_eddy_correction:
    label: QSIPrep head-motion and eddy-current correction
    rationale: >
      TORTOISE DIFFPREP is the selected conservative default in Neurodesk
      qsiprep/26.1.1. The image's FSL-eddy conda metadata is mode 0600 and
      unreadable to the runtime user, which prevents QSIPrep's eddy workflow
      from being constructed before processing starts.
    default: tortoise
    options:
      tortoise:
        label: TORTOISE DIFFPREP quadratic correction (tortoise)
      eddy:
        label: FSL eddy (eddy; unavailable in the current Neurodesk image)
      shoreline:
        label: SHORELine (shoreline; deprecated upstream)
  reconstruction:
    label: QSIRecon bundle reconstruction specification
    when: [analysis_method.qsirecon]
    rationale: >
      SS3T AutoTrack provides the baseline for the existing acquisitions.
      Multi-shell acquisitions can be evaluated with a matched comparison
      before adding a separate multi-shell workflow.
    default: ss3t_fod_autotrack
    options:
      ss3t_fod_autotrack:
        label: SS3T FOD AutoTrack (ss3t_fod_autotrack)
      dsi_studio_autotrack:
        label: DSI Studio GQI AutoTrack (dsi_studio_autotrack)
  bundle_qc:
    label: Diffusion-space lesion overlap and along-streamline FA/MD
    when: [analysis_method.qsirecon]
    rationale: >
      Bundle QC records how much of a reconstructed bundle overlaps the
      registered lesion and how much has usable tensor data. The three
      bilateral language-related bundles give a focused exploratory pilot.
    default: "on"
    options:
      "on":
        label: Six language bundles with overlap, coverage, and profiles
      "off":
        label: Bundle-wide QSIRecon scalar summaries only
  profile_nodes:
    label: Number of normalized positions along each streamline
    when: [analysis_method.qsirecon]
    rationale: >
      Use 21 evenly spaced positions for a compact exploratory profile.
      A finer sampling grid can test sensitivity to bin density without
      increasing the resolution of the diffusion images.
    default: nodes_21
    options:
      nodes_21:
        label: 21 normalized positions
      nodes_41:
        label: 41 normalized positions
outputs:
  - id: dmri_preproc
    type: data
    format: directory
    description: >
      Published scheduler receipt pointing to the separately atomic QSIPrep
      derivative, with motion/eddy correction, susceptibility correction
      when permitted by the phase-encoding inputs, rotated gradients, QC tables,
      transforms and HTML report. Anatomical normalization uses the lesion ROI.
    inputs: [scheduler_request, bids_dataset, selected_lesion_mask]
    decisions: [motion_eddy_correction]
    recipe:
      command: CALMAR_DMRI_HMC_METHOD={decisions.motion_eddy_correction} bash src/analysis_45_dmri_preproc.sh {inputs.scheduler_request} {output}
      container: qsiprep:26.1.1
      resources:
        cpus: 8
        memory: 48 GB
        time_limit: "12:00:00"
  - id: dmri_recon
    when: [analysis_method.qsirecon]
    type: data
    format: directory
    description: >
      Published scheduler receipt pointing to the separately atomic QSIRecon
      bundle streamlines, tensor scalar summaries and HTML report.
      Bundle absence remains an experimental tracking result requiring visual QC.
    inputs: [scheduler_request, dmri_preproc]
    decisions: [analysis_method, reconstruction]
    recipe:
      command: CALMAR_DMRI_METHOD={decisions.analysis_method} CALMAR_DMRI_RECON_SPEC={decisions.reconstruction} bash src/analysis_46_dmri_recon.sh {inputs.scheduler_request} {output}
      container: qsirecon:26.0.1
      resources:
        cpus: 8
        memory: 48 GB
        time_limit: "12:00:00"
  - id: dmri_metrics
    when: [analysis_method.qsirecon]
    type: table
    format: directory
    description: >
      Published scheduler receipt pointing to the atomic directory containing
      normalized per-bundle FA/MD TSV and metadata. With bundle QC enabled,
      ANTs 2.6.5 resamples the native T1 lesion with nearest-neighbor interpolation
      using QSIPrep's orig-to-anat and anat-to-ACPC transforms. Both percentages
      use unique in-grid voxels sampled from reconstructed streamlines as the
      denominator. Overlap counts lesion voxels and coverage counts brain-mask
      voxels with physically plausible FA and MD. Along-streamline nodes start
      at the superior end for the frontal aslant tract and at the more
      posterior end for the arcuate and inferior fronto-occipital fasciculi. At each node
      the report retains the median across valid unique voxels and voxel counts.
      Outputs include the aligned lesion, an overlay PNG and, when bundles
      can be measured, a profile TSV and PNG. Missing bundles have explicit
      QC statuses and no imputed measurements. If required inputs for the
      supplement are unavailable, the bundle-wide scalar summaries still publish.
    inputs: [scheduler_request, dmri_preproc, dmri_recon]
    decisions: [analysis_method, bundle_qc, profile_nodes]
    recipe:
      command: CALMAR_DMRI_METHOD={decisions.analysis_method} CALMAR_DMRI_BUNDLE_QC={decisions.bundle_qc} CALMAR_DMRI_PROFILE_NODES={decisions.profile_nodes} bash src/analysis_47_dmri_metrics.sh {inputs.scheduler_request} {output}
      container: python:3.13.18
  - id: participant_report_evidence
    when: [analysis_method.qsirecon]
    type: report
    format: html
    description: >
      Optional direct-dMRI section rendered by calmar.diffusion. It identifies
      participant measurements, shows missing quantities explicitly, carries QC
      warnings and remains separate from BCB/DeepDisco disconnection evidence.
    inputs: [dmri_metrics]
  - id: dipy_dti_recon
    when: [analysis_method.dipy_dti]
    type: data
    format: directory
    description: >
      Published scheduler receipt pointing to the separately atomic DIPY 1.12.1
      weighted-least-squares DTI derivative. It contains FA, MD, AD and RD maps
      on the QSIPrep DWI grid plus the exact source and software record; it does
      not contain or imply tract bundles.
    inputs: [scheduler_request, dmri_preproc]
    decisions: [analysis_method]
    recipe:
      command: CALMAR_DMRI_METHOD={decisions.analysis_method} bash src/analysis_46_dmri_recon.sh {inputs.scheduler_request} {output}
      container: dipy:1.12.1
      resources:
        cpus: 8
        memory: 48 GB
        time_limit: "12:00:00"
  - id: dipy_dti_metrics
    when: [analysis_method.dipy_dti]
    type: table
    format: directory
    description: >
      Published atomic directory containing validated whole-brain FA, MD, AD
      and RD median and percentile summaries, method metadata, and the PNG
      FA/MD montage that must be reviewed before interpretation.
    inputs: [scheduler_request, dipy_dti_recon]
    decisions: [analysis_method]
    recipe:
      command: CALMAR_DMRI_METHOD={decisions.analysis_method} bash src/analysis_47_dmri_metrics.sh {inputs.scheduler_request} {output}
      container: python:3.13.15
  - id: participant_tensor_report_evidence
    when: [analysis_method.dipy_dti]
    type: report
    format: html
    description: >
      Optional direct-dMRI report section identifying DIPY DTI as a voxelwise
      second method, listing the four validated tensor summaries and preserving
      its visual-QC and stroke-confound warnings.
    inputs: [dipy_dti_metrics]
findings:
  autotrack_language_bundle_pilot:
    label: Language-bundle QC and profile pilot
    claim: >
      The supplemental metrics ran on four existing SS3T AutoTrack
      reconstructions and measured 22 of 24 expected bilateral bundles.
      Two cases lacked a left arcuate streamline file and retained an
      explicit missing status. The measured bundles had no sampled points
      outside the diffusion grid. Lesion overlays were visually inspected.
    created_at: 2026-11-27T01:39:00Z
    scope: >
      Four single-shell ds004884 cases, three with lesion anatomy from
      a different session. This validates execution and artifact
      interpretation in the pilot cases. Multi-shell methods were outside
      this run.
    tags: [validation, diffusion]
    evidence:
      - id: m2001_missing_bundle
        artifact: dmri_metrics
        snapshot: data/ds004884/derivatives/calmar-dmri/sub-M2001/ses-1225/dwi/metrics-bundle-qc-21/sub-M2001_ses-1225_desc-direct_tractometry.json
      - id: m2004_bundle_overlay
        artifact: dmri_metrics
        snapshot: data/ds004884/derivatives/calmar-dmri/sub-M2004/ses-780/dwi/metrics-bundle-qc-21/bundle_lesion_qc.png
      - id: m2004_bundle_profiles
        artifact: dmri_metrics
        snapshot: data/ds004884/derivatives/calmar-dmri/sub-M2004/ses-780/dwi/metrics-bundle-qc-21/bundle_profiles.tsv
    notes: >
      Slurm jobs 32, 33, 34 and 35 completed with exit code 0. For each case
      the saved PNGs were verified, node counts and FA/MD ranges checked,
      and the producing ANTs version recorded in the bundle sidecar.
  m2051_dipy_dti_validation:
    label: M2051 DIPY-DTI validation
    claim: >
      The DIPY 1.12.1 weighted-least-squares tensor path completed for
      sub-M2051 ses-284 after the existing QSIPrep derivative and published
      four maps plus a valid PNG QC montage. Within the QSIPrep brain mask the
      medians were FA 0.13232 (unitless), MD 0.0010017, AD 0.0012772 and
      RD 0.0009060 mm2/s; these are descriptive validation values, not
      normative findings.
    created_at: 2026-11-11T02:25:00Z
    scope: >
      One 64-direction b=0/1000 participant used to validate execution,
      serialization, physical-unit checks and visual-QC generation. It does
      not establish clinical validity or compare DIPY with QSIRecon.
    tags: [validation, diffusion]
    evidence:
      - id: m2051_tensor_metrics
        artifact: dipy_dti_metrics
        snapshot: data/ds004884/derivatives/calmar-dmri/sub-M2051/ses-284/dwi/dipy_metrics/sub-M2051_ses-284_model-DIPYDTI_desc-tensor_metrics.tsv
      - id: m2051_tensor_qc
        artifact: dipy_dti_metrics
        snapshot: data/ds004884/derivatives/calmar-dmri/sub-M2051/ses-284/dwi/dipy_metrics/sub-M2051_ses-284_model-DIPYDTI_desc-tensor_qc.png
    notes: >
      Slurm jobs 157 and 158 completed 0:0. The saved 1470x868 PNG was verified
      as a real PNG and re-inspected on 2026-11-11; FA/MD alignment and tensor
      structure were plausible. A broad high-MD region remains visible and
      requires participant-level interpretation; it was not clipped or relabelled.
      Job 157 used an earlier analysis_46 script (SHA-256
      54eb9084274fc4eccdfe02fe48f7d8360f81a39c8bb29f01129d427bd451ec9e) that
      unnecessarily loaded qsirecon/26.0.1, although its recorded producing
      binary was the host dipy_fit_dti 1.12.1. The current recipe removes that
      unused module; this note preserves the environment that produced the
      cited artifact rather than attributing it retrospectively to the new script.
