id: lesion_segmentation_benchmark
version: "0.0.12"
name: Stroke lesion segmentation benchmark (LINDA · SynthStroke · OpenADS)
description: >
  Benchmark of the stroke lesion segmentation tools packaged in Neurodesk —
  LINDA (chronic, T1w), SynthStroke (chronic, T1w), OpenADS (acute, DWI+ADC) —
  against expert or exact ground-truth masks. Two units of work: (1) OpenADS
  on the real ISLES 2022 cohort, the only auto-downloadable dataset providing
  native DWI+ADC+expert masks for every subject; (2) a cross-tool comparison
  on synthetic stroke phantoms whose co-registered T1w+DWI+ADC modalities let
  all three tools run on the same subjects against the same exact ground
  truth, despite their different required inputs. Tool invocations and metric
  definitions reproduce lesion-segmentation-benchmark.ipynb (the earlier
  n=2-per-dataset exploratory run) in retained Slurm scripts under src/.

inputs:
  - id: isles2022
    type: data
    label: ISLES 2022
    source: https://zenodo.org/records/7153326
    description: >
      ISLES 2022 multimodal acute/subacute stroke dataset — 250 subjects,
      each with native-space DWI (b=1000 trace), ADC, FLAIR, and an expert
      lesion mask under derivatives/<sub>/<ses>/<sub>_<ses>_msk.nii.gz.
      Materialized into data/ISLES-2022 by src/analysis_00_download_data.sh
      (Zenodo zip, md5 302ee280373cdd5c190ab763d72a7a50); originally fetched
      by lesion-segmentation-benchmark.ipynb §4 with the same URL and
      checksum.
  - id: synthetic_acute
    type: data
    label: Synthetic acute phantoms
    source: data/synthetic_acute
    description: >
      Six synthetic acute-stroke subjects (sub-synacu000..005), each with
      five co-registered modalities — T1w, T2w, FLAIR, DWI, ADC — and the
      exact ground-truth mask (derivatives/<sub>/<sub>_msk.nii.gz).
      T1w/DWI/ADC generated by calmar/synthetic.py (seed 7, phase "acute")
      via src/analysis_08_gen_synthetic.sh; FLAIR/T2w derived
      deterministically from T1w + mask (seeded) by
      src/analysis_09_add_flair_t2.sh. Acute FLAIR is subacute-visible
      (hyperintense); hyperacute DWI-FLAIR mismatch is not modeled.
  - id: synthetic_chronic
    type: data
    label: Synthetic chronic phantoms
    source: data/synthetic_chronic
    description: >
      Six synthetic chronic-stroke subjects (sub-synchr000..005), same
      five-modality layout and generators as synthetic_acute but with the
      chronic (encephalomalacia) signature: T1w/FLAIR-dark CSF-like cavity
      with a FLAIR-bright gliotic rim, T2w-bright cavity, DWI
      pseudonormalized, ADC elevated; seed 7, phase "chronic".

  - id: synthetic_edgecases
    type: data
    label: Edge-case phantom battery
    source: data/synthetic_edgecases
    description: >
      36 "borderline" phantoms (12 categories x 3 subjects, seed 11, 5
      co-registered modalities each) stressing the failure modes that
      distinguish tools: tiny (~0.3 ml) / multifocal (8-14 emboli-like foci)
      / territorial (~50 ml) / faint-contrast (40% signature) /
      periventricular / cortical-surface / mixed-chronology (acute lesion +
      chronic cavity distractor with its own desc-distractorchronic mask,
      excluded from GT) / lesion-negative controls for acute, plus tiny /
      multifocal / faint / negative for chronic. Generated by
      edgecase_install() in calmar/synthetic.py via
      src/analysis_10_gen_edgecases.sh; category manifest in
      participants.tsv; per-category QC montage at
      reports/benchmarks/edgecase_battery_qc.png.

outputs:
  - id: isles_metrics
    from: isles2022_openads.metrics_table
  - id: isles_qc
    from: isles2022_openads.qc_montage
  - id: synthetic_metrics
    from: synthetic_crosstool.crosstool_metrics
  - id: synthetic_qc
    from: synthetic_crosstool.crosstool_qc

analyses:
  isles2022_openads:
    id: isles2022_openads
    name: OpenADS on ISLES 2022
    description: >
      OpenADS (openadscpu/1.0.0) evaluated against expert lesion masks on a
      seeded cohort of the 250-subject ISLES 2022 dataset — the first real
      (non-synthetic) cohort on which OpenADS is evaluated at scale in this
      project.

    inputs:
      - id: isles2022
        from: ../isles2022

    decisions:
      cohort_size:
        label: Evaluation cohort size
        rationale: >
          OpenADS-CPU costs roughly 8-10 minutes per subject on this node, so
          cohort size is the main runtime/statistics trade-off. The pilot
          samples 25 of the 250 subjects with random.Random(31) (the
          notebook's sampling scheme and seed); the two subjects already
          completed in the earlier n=2 run (sub-strokecase0004,
          sub-strokecase0121) are force-included so their cached, previously
          inspected results remain part of the same cohort — with seed 31
          both happen to fall inside the 25-subject sample anyway.
        tags: [data-selection]
        default: n25
        options:
          n25:
            label: Pilot (n=25, seed 31, priors included)
            description: >
              Seeded random sample of 25 subjects plus the two previously
              completed subjects. ~1-1.5 h wall-clock at 4 concurrent array
              tasks.
          n250:
            label: Full cohort (n=250)
            description: >
              All ISLES 2022 subjects with DWI+ADC+mask. ~8-12 h wall-clock;
              intended after the pilot validates per-subject success.

    outputs:
      - id: cohort_manifest
        type: data
        label: Cohort manifest
        description: >
          TSV manifest (subject, session) at
          reports/benchmarks/cohort_isles2022.tsv listing the evaluation
          cohort; one Slurm array task per line.
        inputs: [isles2022]
        decisions: [cohort_size]
        recipe:
          command: bash src/analysis_01_select_cohort.sh {decisions.cohort_size}

      - id: openads_masks
        type: data
        label: OpenADS lesion masks
        description: >
          Per-subject binary lesion masks in native DWI space at
          data/ISLES-2022/derivatives/openads/<sub>/<ses>/dwi/
          <sub>_<ses>_space-DWI_desc-lesion_mask.nii.gz. Produced by the
          two-pass OpenADS runner (prepdata,gen_mask,skull_strip →
          deterministic regeneration of the *_brain files from raw image x
          SynthStrip mask → registration,inference,report) and published
          atomically with OpenADS's own RAS+ output affine (correct world
          coordinates). See the pipeline-defect findings: the earlier
          symlink-based staging and DWI-affine reattachment both corrupted
          results and their outputs are quarantined under
          derivatives/openads_quarantine_adcbug_20260915 and
          reports/benchmarks/*_adcbug_/_affbug_20260915.*.
        inputs: [isles2022, cohort_manifest]
        recipe:
          command: sbatch --parsable src/analysis_02_openads_isles2022.sh
          resources:
            cpus: 4
            memory: 16G
            time_limit: "01:00:00"

      - id: metrics_table
        type: table
        label: Per-subject metrics
        description: >
          reports/benchmarks/openads_isles2022_metrics.csv — Dice, IoU,
          absolute volumes and volume difference (ml), HD95 and mean surface
          distance (mm) of each OpenADS mask against the expert mask,
          computed on the expert grid (prediction resampled
          nearest-neighbour, binarised at >0), matching the notebook's metric
          definitions.
        inputs: [isles2022, cohort_manifest, openads_masks]
        recipe:
          command: sbatch --parsable src/analysis_03_openads_metrics.sh
          resources:
            cpus: 2
            memory: 8G
            time_limit: "00:20:00"

      - id: qc_montage
        type: figure
        label: QC montage
        description: >
          reports/benchmarks/openads_isles2022_qc.png — DWI slices at the
          lesion centroid for the worst-, median-, and best-Dice subjects
          with expert (green) and OpenADS (red) contours. Written by the same
          invocation of src/analysis_03_openads_metrics.sh that produces
          metrics_table; do not submit this recipe separately when
          metrics_table has already run.
        inputs: [isles2022, cohort_manifest, openads_masks]
        recipe:
          command: sbatch --parsable src/analysis_03_openads_metrics.sh
          resources:
            cpus: 2
            memory: 8G
            time_limit: "00:20:00"

    prior_insights:
      isles2022_completes_openads_requirements:
        label: ISLES 2022 satisfies OpenADS input requirements
        claim: >
          ISLES 2022 is the only dataset in this project's registry providing
          native-space DWI and ADC plus expert masks for all subjects; ISLES
          2015 SISS ships a single-volume DWI trace and no ADC, so OpenADS
          aborts in preprocessing there, and the synthetic acute dataset was
          built precisely as a stand-in for this gap.
        created_at: "2026-09-15T00:00:00Z"
        evidence:
          - id: on_disk_cohort_manifest
            artifact: "cohort_manifest"
        notes: >
          Verified on disk 2026-09-15: all 250 ISLES-2022 subjects have
          *_dwi.nii.gz, *_adc.nii.gz and derivatives/<sub>/<ses>/*_msk.nii.gz
          materialized (no annex pointers). The notebook's OpenADS runner
          completed end-to-end on sub-strokecase0004 and sub-strokecase0121.

    findings:
      openads_isles2022_pilot_performance:
        label: OpenADS reaches median Dice 0.81 on the ISLES 2022 pilot
        claim: >
          On the corrected pipeline, OpenADS segments the 25-subject ISLES
          2022 pilot at median Dice 0.809 (IQR 0.540-0.865; mean 0.670 ±
          0.293), with 19/25 subjects at Dice ≥ 0.5. All six poor scores are
          sub-milliliter reference lesions (0.12-0.49 ml) or the one
          DWI-negative case (empty expert mask, 0.07 ml predicted) — the
          expected small-lesion Dice penalty, not systematic failure.
        created_at: "2026-09-15T14:40:00Z"
        evidence:
          - id: pilot_metrics_csv
            artifact: "metrics_table"
          - id: pilot_qc_png
            artifact: "qc_montage"
      openads_stroke_subjectid_bug:
        label: OpenADS 1.0.0 corrupts DWI input for "stroke*" subject ids
        claim: >
          OpenADS 1.0.0's skull-strip stage renames every stripped image to
          <sub>_stroke.nii.gz when the subject id contains "stroke" — true
          for every ISLES 2022 subject (sub-strokecase*) — so the stripped
          ADC overwrites the stripped DWI; downstream the model receives ADC
          as its DWI input and segments CSF/ventricles (near-zero Dice with
          plausible volumes). This also invalidated the exploratory
          notebook's n=2 ISLES results. Fixed by regenerating the *_brain
          inputs deterministically from raw image x brain mask.
        created_at: "2026-09-15T14:40:00Z"
        evidence:
          - id: corrected_metrics_after_fix
            artifact: "metrics_table"
        notes: >
          Source: ads/pipelines/preprocessing_brain_masking.py (~line 164,
          "Special case for stroke masks") in
          openadscpu_1.0.0_20260518.simg. Affected outputs preserved under
          data/ISLES-2022/derivatives/openads_quarantine_adcbug_20260915 and
          reports/benchmarks/openads_isles2022_*_adcbug_20260915.*; their
          QC montage shows predictions tracing the ventricles. Synthetic
          subjects (synacu*/synchr*) do not trigger the bug — the phantoms'
          0.93 vs ISLES' 0.01 contrast is what exposed it. Worth reporting
          upstream.
      openads_affine_reattachment_flips_masks:
        label: Reattaching the source DWI affine mirror-flips OpenADS masks
        claim: >
          This OpenADS build reorients volumes to RAS+ correctly (data and
          affine together), so its native segment mask already has correct
          world coordinates; the exploratory notebook's workaround of
          re-attaching the source DWI affine mirror-flips masks on non-RAS
          native grids. On sub-strokecase0009 the same mask scores Dice
          0.798 with OpenADS's own affine and 0.000 with the reattached
          source affine.
        created_at: "2026-09-15T14:40:00Z"
        evidence:
          - id: affine_comparison_metrics
            artifact: "metrics_table"
        notes: >
          Reattached-affine metrics preserved as
          reports/benchmarks/openads_isles2022_*_affbug_20260915.*. On the
          RAS-aligned synthetic phantoms reattachment is a no-op, which is
          why the notebook's workaround appeared validated there.

  synthetic_crosstool:
    id: synthetic_crosstool
    name: Cross-tool benchmark on synthetic stroke phantoms
    description: >
      All three tools run on the same synthetic subjects against the same
      exact implanted ground truth. Each phantom (MNI152 scaffold, 1-3
      ellipsoidal lesions, 2 mm grid) carries perfectly co-registered T1w,
      DWI, and ADC with phase-appropriate lesion signatures — acute: DWI
      hyper / ADC ~350 / T1w subtle; chronic: T1w CSF-dark cavity / ADC
      ~elevated / DWI pseudonormalized — so tools with different required
      modalities become directly comparable per subject. Off-phase runs
      (LINDA and SynthStroke on acute; OpenADS on chronic) are deliberate
      transfer baselines. Generator constants (lesion radii 4-9 voxels, 1-3
      lesions, tissue/lesion intensity values from the acute-stroke ADC
      literature) are fixed in calmar/synthetic.py and documented in its
      module docstring; the datasets on disk were generated with seed 7 and
      n=6 per phase by the notebook (§4). CAVEAT recorded in the generator:
      synthetic lesions are cleaner and more separable than real stroke —
      this is a controlled pipeline / gross-detectability benchmark, not a
      measure of real-world accuracy.

    inputs:
      - id: synthetic_acute
        from: ../synthetic_acute
      - id: synthetic_chronic
        from: ../synthetic_chronic
      - id: synthetic_edgecases
        from: ../synthetic_edgecases

    decisions:
      hdbet_mode:
        label: HD-BET skull-strip mode (LINDA preprocessing)
        rationale: >
          LINDA's mask-bypass wrapper takes an HD-BET brain mask; HD-BET
          offers a single-model "fast" mode (~10x faster on CPU) and a
          5-model "accurate" ensemble. The brain mask bounds LINDA's
          candidate region, so the mode can shift the segmentation. The
          earlier notebook runs used fast on CPU; accurate is only practical
          with a GPU.
        tags: [preprocessing]
        default: fast
        options:
          fast:
            label: Fast (-mode fast, single model)
            description: CPU-practical; used by all prior runs.
          accurate:
            label: Accurate (-mode accurate, 5-model ensemble)
            description: >
              Considered for completeness; impractical on this CPU-only node
              for a 12-subject array.

    outputs:
      - id: synthstroke_masks
        type: data
        label: SynthStroke masks (both phases)
        description: >
          data/synthetic_<phase>/derivatives/synthstroke/<sub>/anat/
          <sub>_space-T1w_desc-lesion_mask.nii.gz for all 12 subjects.
        inputs: [synthetic_acute, synthetic_chronic]
        recipe:
          command: sbatch --parsable src/analysis_04_synthetic_synthstroke.sh
          resources:
            cpus: 4
            memory: 8G
            time_limit: "00:30:00"

      - id: linda_masks
        type: data
        label: LINDA masks (both phases)
        description: >
          data/synthetic_<phase>/derivatives/linda/<sub>/anat/
          <sub>_space-T1w_desc-lesion_mask.nii.gz for all 12 subjects, via
          HD-BET skull-strip + src/analysis_17_linda_predict_with_mask.sh (mask-bypass
          wrapper dispatching into the LINDA singularity container).
        inputs: [synthetic_acute, synthetic_chronic]
        decisions: [hdbet_mode]
        recipe:
          command: sbatch --parsable src/analysis_05_synthetic_linda.sh {decisions.hdbet_mode}
          resources:
            cpus: 4
            memory: 16G
            time_limit: "01:30:00"

      - id: openads_masks
        type: data
        label: OpenADS masks (both phases)
        description: >
          data/synthetic_<phase>/derivatives/openads/<sub>/dwi/
          <sub>_space-DWI_desc-lesion_mask.nii.gz for all 12 subjects; same
          two-pass runner and publication rules as the ISLES analysis (the
          phantom grid is already RAS+, so affine handling is a no-op here).
        inputs: [synthetic_acute, synthetic_chronic]
        recipe:
          command: sbatch --parsable src/analysis_06_synthetic_openads.sh
          resources:
            cpus: 4
            memory: 16G
            time_limit: "01:00:00"

      - id: crosstool_metrics
        type: table
        label: Cross-tool metrics table
        description: >
          reports/benchmarks/synthetic_crosstool_metrics.csv — Dice, IoU,
          volumes, HD95, mean surface distance for every tool x subject x
          phase against the exact ground truth, computed on the ground-truth
          grid (nearest-neighbour resampling, binarised at >0).
        inputs: [synthetic_acute, synthetic_chronic, synthstroke_masks,
                 linda_masks, openads_masks]
        recipe:
          command: sbatch --parsable src/analysis_07_synthetic_metrics.sh
          resources:
            cpus: 2
            memory: 8G
            time_limit: "00:20:00"

      - id: crosstool_qc
        type: figure
        label: Cross-tool QC montage
        description: >
          reports/benchmarks/synthetic_crosstool_qc.png — per phase, the
          median-Dice subject's T1w slice with ground truth and all three
          tool contours. Written by the same invocation of
          src/analysis_07_synthetic_metrics.sh that produces
          crosstool_metrics; do not submit separately.
        inputs: [synthetic_acute, synthetic_chronic, synthstroke_masks,
                 linda_masks, openads_masks]
        recipe:
          command: sbatch --parsable src/analysis_07_synthetic_metrics.sh
          resources:
            cpus: 2
            memory: 8G
            time_limit: "00:20:00"

      - id: edgecase_synthstroke_masks
        type: data
        label: SynthStroke masks on the edge-case battery
        description: >
          data/synthetic_edgecases/derivatives/synthstroke/<sub>/anat/
          <sub>_space-T1w_desc-lesion_mask.nii.gz for all 36 battery
          subjects; doubles as the worked example of an edge-case tool
          runner.
        inputs: [synthetic_edgecases]
        recipe:
          command: sbatch --parsable src/analysis_11_edgecase_synthstroke.sh
          resources:
            cpus: 4
            memory: 8G
            time_limit: "00:45:00"

      - id: edgecase_metrics
        type: table
        label: Edge-case per-category metrics
        description: >
          reports/benchmarks/edgecase_metrics.csv — for every tool
          discovered under the battery's derivatives/: Dice, detection (any
          GT overlap), false-positive volume on lesion-negative subjects,
          and predicted volume inside the mixed-chronology distractor.
          Tools are auto-discovered, so new runners need no metric changes.
        inputs: [synthetic_edgecases, edgecase_synthstroke_masks]
        recipe:
          command: sbatch --parsable src/analysis_12_edgecase_metrics.sh
          resources:
            cpus: 2
            memory: 8G
            time_limit: "00:20:00"

    findings:
      crosstool_phase_specificity:
        label: Tools segment only their in-phase, in-modality signature
        claim: >
          On the 3-tools x 2-phases x 6-subjects phantom matrix, performance
          is sharply phase-specific: OpenADS reaches Dice 0.926 ± 0.040 on
          acute phantoms but 0.000 on chronic ones (no restricted-diffusion
          signature), while the T1w tools stay low everywhere — LINDA 0.118
          (acute) / 0.062 (chronic), SynthStroke 0.000 (acute) / 0.259 mean
          but 0.000 median (chronic, bimodal: detected in 2 of 6 subjects).
          The co-registered modalities make these numbers directly
          comparable per subject despite the tools' different inputs.
        created_at: "2026-09-15T14:40:00Z"
        evidence:
          - id: crosstool_metrics_csv
            artifact: "crosstool_metrics"
          - id: crosstool_qc_png
            artifact: "crosstool_qc"
      phantoms_validate_pipelines_not_rankings:
        label: Phantoms validate pipelines, not chronic-tool rankings
        claim: >
          Even on in-phase chronic phantoms LINDA scores far below its
          real-data chronic performance (0.062 here vs ~0.2 on ds004884 in
          the exploratory notebook run), so the clean synthetic cavity lacks
          the lesion texture/context LINDA's features rely on. The phantoms'
          exact ground truth is nevertheless what exposed both ISLES
          pipeline defects (0.93 on phantoms vs 0.01 on ISLES flagged input
          corruption rather than model failure) — treat this dataset as a
          pipeline-correctness and gross-detectability control, per the
          generator's documented caveat.
        created_at: "2026-09-15T14:40:00Z"
        evidence:
          - id: crosstool_metrics_csv2
            artifact: "crosstool_metrics"
